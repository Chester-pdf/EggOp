name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p .
          cat > build.gradle <<'EGGDROPS_EOF'
          plugins {
          	id 'net.fabricmc.fabric-loom'
          	id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
          	archivesName = project.archives_base_name
          }

          repositories {
          	// Loom сам добавляет нужные Maven-репозитории.
          }

          dependencies {
          	// 26.x — игра без обфускации, поэтому строки mappings больше нет.
          	minecraft "com.mojang:minecraft:${project.minecraft_version}"
          	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
          	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
          	inputs.property "version", project.version

          	filesMatching("fabric.mod.json") {
          		expand "version": project.version
          	}
          }

          tasks.withType(JavaCompile).configureEach {
          	it.options.release = 25
          }

          java {
          	withSourcesJar()
          	sourceCompatibility = JavaVersion.VERSION_25
          	targetCompatibility = JavaVersion.VERSION_25
          }
          EGGDROPS_EOF
          mkdir -p .
          cat > gradle.properties <<'EGGDROPS_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Fabric: https://fabricmc.net/develop
          minecraft_version=26.2
          loader_version=0.19.5
          loom_version=1.18.4
          fabric_api_version=0.161.0+26.2

          # Mod
          mod_version=1.0.0
          maven_group=com.example.eggdrops
          archives_base_name=eggdrops
          EGGDROPS_EOF
          mkdir -p .
          cat > settings.gradle <<'EGGDROPS_EOF'
          pluginManagement {
          	repositories {
          		maven {
          			name = 'Fabric'
          			url = 'https://maven.fabricmc.net/'
          		}
          		mavenCentral()
          		gradlePluginPortal()
          	}
          	plugins {
          		id 'net.fabricmc.fabric-loom' version providers.gradleProperty('loom_version').get()
          	}
          }

          rootProject.name = 'eggdrops'
          EGGDROPS_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'EGGDROPS_EOF'
          {
            "schemaVersion": 1,
            "id": "eggdrops",
            "version": "${version}",
            "name": "Op Drops",
            "description": "Брошенные яйца роняют крайне имбовые предметы.",
            "authors": ["You"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["com.example.eggdrops.EggDropsMod"]
            },
            "mixins": ["eggdrops.mixins.json"],
            "depends": {
              "fabricloader": ">=0.19.0",
              "minecraft": "~26.2",
              "java": ">=25",
              "fabric-api": "*"
            }
          }
          EGGDROPS_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/eggdrops.mixins.json <<'EGGDROPS_EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.eggdrops.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": [
              "ProjectileMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EGGDROPS_EOF
          mkdir -p src/main/java/com/example/eggdrops
          cat > src/main/java/com/example/eggdrops/EggDropsMod.java <<'EGGDROPS_EOF'
          package com.example.eggdrops;

          import net.fabricmc.api.ModInitializer;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public class EggDropsMod implements ModInitializer {
          	public static final String MOD_ID = "eggdrops";
          	public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

          	/** Шанс, что яйцо вообще что-то уронит: 1.0 = всегда, 0.5 = в половине случаев. */
          	public static final float DROP_CHANCE = 0.5f;

          	/** Если дроп случился — шанс, что это «высокий» уровень (2 разных предмета). */
          	public static final float HIGH_TIER_CHANCE = 0.25f;

          	@Override
          	public void onInitialize() {
          		LOGGER.info("Egg Drops загружен: яйца теперь опасно щедрые.");
          	}
          }
          EGGDROPS_EOF
          mkdir -p src/main/java/com/example/eggdrops
          cat > src/main/java/com/example/eggdrops/OpLoot.java <<'EGGDROPS_EOF'
          package com.example.eggdrops;

          import java.util.List;
          import java.util.function.Function;
          import net.minecraft.core.Holder;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.item.enchantment.Enchantment;
          import net.minecraft.world.item.enchantment.Enchantments;

          /**
           * Два пула лута по 15 предметов:
           *  - LOW  — «обычный» уровень, роняет 1 предмет;
           *  - HIGH — «высокий» уровень, роняет 2 разных предмета.
           */
          public final class OpLoot {

          	private OpLoot() {}

          	private record Ench(ResourceKey<Enchantment> key, int level) {}

          	private static Ench e(ResourceKey<Enchantment> key, int level) {
          		return new Ench(key, level);
          	}

          	private static Function<ServerLevel, ItemStack> stack(Item item, int count) {
          		return level -> new ItemStack(item, count);
          	}

          	private static Function<ServerLevel, ItemStack> gear(Item item, Ench... enchants) {
          		return level -> {
          			ItemStack stack = new ItemStack(item);
          			var registry = level.registryAccess().lookupOrThrow(Registries.ENCHANTMENT);
          			for (Ench ench : enchants) {
          				Holder<Enchantment> holder = registry.getOrThrow(ench.key());
          				stack.enchant(holder, ench.level());
          			}
          			return stack;
          		};
          	}

          	// ---------------------------------------------------------------- LOW (15)
          	private static final List<Function<ServerLevel, ItemStack>> LOW = List.of(
          			stack(Items.GOLDEN_APPLE, 16),
          			stack(Items.DIAMOND, 32),
          			stack(Items.EXPERIENCE_BOTTLE, 64),
          			stack(Items.ENDER_PEARL, 16),
          			stack(Items.FIREWORK_ROCKET, 64),
          			stack(Items.WIND_CHARGE, 64),
          			stack(Items.EMERALD_BLOCK, 16),
          			stack(Items.TNT, 32),
          			gear(Items.DIAMOND_SWORD,
          					e(Enchantments.SHARPNESS, 5), e(Enchantments.SWEEPING_EDGE, 3),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.DIAMOND_PICKAXE,
          					e(Enchantments.EFFICIENCY, 5), e(Enchantments.FORTUNE, 3),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.BOW,
          					e(Enchantments.POWER, 5), e(Enchantments.INFINITY, 1),
          					e(Enchantments.FLAME, 1), e(Enchantments.UNBREAKING, 3)),
          			gear(Items.CROSSBOW,
          					e(Enchantments.QUICK_CHARGE, 3), e(Enchantments.PIERCING, 4),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.SHIELD,
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.DIAMOND_BOOTS,
          					e(Enchantments.PROTECTION, 4), e(Enchantments.FEATHER_FALLING, 4),
          					e(Enchantments.DEPTH_STRIDER, 3), e(Enchantments.UNBREAKING, 3),
          					e(Enchantments.MENDING, 1)),
          			gear(Items.TRIDENT,
          					e(Enchantments.IMPALING, 5), e(Enchantments.LOYALTY, 3),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1))
          	);

          	// --------------------------------------------------------------- HIGH (15)
          	private static final List<Function<ServerLevel, ItemStack>> HIGH = List.of(
          			stack(Items.ENCHANTED_GOLDEN_APPLE, 32),
          			stack(Items.NETHERITE_INGOT, 16),
          			stack(Items.DIAMOND_BLOCK, 32),
          			stack(Items.TOTEM_OF_UNDYING, 1),
          			gear(Items.ELYTRA,
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			stack(Items.NETHER_STAR, 4),
          			stack(Items.BEACON, 2),
          			stack(Items.DRAGON_EGG, 1),
          			stack(Items.END_CRYSTAL, 64),
          			gear(Items.NETHERITE_SWORD,
          					e(Enchantments.SHARPNESS, 5), e(Enchantments.LOOTING, 3),
          					e(Enchantments.FIRE_ASPECT, 2), e(Enchantments.UNBREAKING, 3),
          					e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_PICKAXE,
          					e(Enchantments.EFFICIENCY, 5), e(Enchantments.FORTUNE, 3),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_AXE,
          					e(Enchantments.SHARPNESS, 5), e(Enchantments.EFFICIENCY, 5),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.MACE,
          					e(Enchantments.DENSITY, 5), e(Enchantments.BREACH, 4),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_CHESTPLATE,
          					e(Enchantments.PROTECTION, 4), e(Enchantments.THORNS, 3),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_BOOTS,
          					e(Enchantments.PROTECTION, 4), e(Enchantments.FEATHER_FALLING, 4),
          					e(Enchantments.DEPTH_STRIDER, 3), e(Enchantments.UNBREAKING, 3),
          					e(Enchantments.MENDING, 1))
          	);

          	/** Возвращает предметы для одного дропа: 1 (обычный уровень) или 2 разных (высокий). */
          	public static List<ItemStack> roll(ServerLevel level) {
          		var random = level.getRandom();

          		if (random.nextFloat() < EggDropsMod.HIGH_TIER_CHANCE) {
          			int first = random.nextInt(HIGH.size());
          			int second = random.nextInt(HIGH.size() - 1);
          			if (second >= first) {
          				second++; // гарантирует, что второй предмет отличается от первого
          			}
          			return List.of(HIGH.get(first).apply(level), HIGH.get(second).apply(level));
          		}

          		return List.of(LOW.get(random.nextInt(LOW.size())).apply(level));
          	}
          }
          EGGDROPS_EOF
          mkdir -p src/main/java/com/example/eggdrops/mixin
          cat > src/main/java/com/example/eggdrops/mixin/ProjectileMixin.java <<'EGGDROPS_EOF'
          package com.example.eggdrops.mixin;

          import com.example.eggdrops.EggDropsMod;
          import com.example.eggdrops.OpLoot;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.Containers;
          import net.minecraft.world.entity.projectile.Projectile;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.phys.HitResult;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /**
           * Вешаемся на общий класс Projectile и проверяем тип сущности — так мы не зависим
           * от точного пакета ThrownEgg, который Mojang переносил между версиями.
           */
          @Mixin(Projectile.class)
          public abstract class ProjectileMixin {

          	@Inject(method = "onHit", at = @At("HEAD"))
          	private void eggdrops$dropOpLoot(HitResult hitResult, CallbackInfo ci) {
          		Projectile projectile = (Projectile) (Object) this;

          		// Сверяем по id сущности, а не по константе EntityType.EGG (её название менялось).
          		String id = BuiltInRegistries.ENTITY_TYPE.getKey(projectile.getType()).toString();
          		if (!id.equals("minecraft:egg")) {
          			return;
          		}
          		if (!(projectile.level() instanceof ServerLevel level)) {
          			return;
          		}
          		if (level.getRandom().nextFloat() >= EggDropsMod.DROP_CHANCE) {
          			return;
          		}

          		for (ItemStack loot : OpLoot.roll(level)) {
          			Containers.dropItemStack(level, projectile.getX(), projectile.getY(), projectile.getZ(), loot);
          		}
          	}
          }
          EGGDROPS_EOF

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0

      - name: Build mod
        run: gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: eggdrops-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
