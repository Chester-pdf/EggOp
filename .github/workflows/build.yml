name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p .
          cat > build.gradle <<'EGGDROPS_EOF'
          plugins {
          	id 'net.fabricmc.fabric-loom'
          	id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
          	archivesName = project.archives_base_name
          }

          repositories {
          	// Loom сам добавляет нужные Maven-репозитории; здесь — только Mod Menu.
          	maven {
          		name = 'Terraformers'
          		url = 'https://maven.terraformersmc.com/releases/'
          	}
          }

          dependencies {
          	// 26.x — игра без обфускации, поэтому строки mappings больше нет.
          	minecraft "com.mojang:minecraft:${project.minecraft_version}"
          	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
          	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

          	// Mod Menu нужен только для компиляции экрана настроек; в игре он необязателен.
          	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
          }

          processResources {
          	inputs.property "version", project.version

          	filesMatching("fabric.mod.json") {
          		expand "version": project.version
          	}
          }

          tasks.withType(JavaCompile).configureEach {
          	it.options.release = 25
          }

          java {
          	withSourcesJar()
          	sourceCompatibility = JavaVersion.VERSION_25
          	targetCompatibility = JavaVersion.VERSION_25
          }
          EGGDROPS_EOF
          mkdir -p .
          cat > gradle.properties <<'EGGDROPS_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Fabric: https://fabricmc.net/develop
          minecraft_version=26.2
          loader_version=0.19.5
          loom_version=1.18.4
          fabric_api_version=0.161.0+26.2
          modmenu_version=20.0.1

          # Mod
          mod_version=1.0.2
          maven_group=com.example.eggdrops
          archives_base_name=eggdrops
          EGGDROPS_EOF
          mkdir -p .
          cat > settings.gradle <<'EGGDROPS_EOF'
          pluginManagement {
          	repositories {
          		maven {
          			name = 'Fabric'
          			url = 'https://maven.fabricmc.net/'
          		}
          		mavenCentral()
          		gradlePluginPortal()
          	}
          	plugins {
          		id 'net.fabricmc.fabric-loom' version providers.gradleProperty('loom_version').get()
          	}
          }

          rootProject.name = 'eggdrops'
          EGGDROPS_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'EGGDROPS_EOF'
          {
            "schemaVersion": 1,
            "id": "eggdrops",
            "version": "${version}",
            "name": "Op Drops",
            "description": "Брошенные яйца и сломанная трава роняют крайне имбовые предметы.",
            "authors": ["You"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["com.example.eggdrops.EggDropsMod"],
              "modmenu": ["com.example.eggdrops.client.OpDropsModMenu"]
            },
            "mixins": ["eggdrops.mixins.json"],
            "depends": {
              "fabricloader": ">=0.19.2",
              "minecraft": "~26.2",
              "java": ">=25",
              "fabric-api": "*"
            },
            "suggests": {
              "modmenu": "*"
            }
          }
          EGGDROPS_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/eggdrops.mixins.json <<'EGGDROPS_EOF'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.example.eggdrops.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": [
              "ProjectileMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          EGGDROPS_EOF
          mkdir -p src/main/java/com/example/eggdrops
          cat > src/main/java/com/example/eggdrops/EggDropsMod.java <<'EGGDROPS_EOF'
          package com.example.eggdrops;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.event.player.PlayerBlockBreakEvents;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.Containers;
          import net.minecraft.world.item.ItemStack;
          import org.slf4j.Logger;
          import org.slf4j.LoggerFactory;

          public class EggDropsMod implements ModInitializer {
          	public static final String MOD_ID = "eggdrops";
          	public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);

          	@Override
          	public void onInitialize() {
          		OpDropsConfig.load();

          		// Сломал траву (обычную или высокую) — получи ОП-лут.
          		PlayerBlockBreakEvents.AFTER.register((level, player, pos, state, blockEntity) -> {
          			if (!(level instanceof ServerLevel serverLevel)) {
          				return;
          			}

          			String id = BuiltInRegistries.BLOCK.getKey(state.getBlock()).toString();
          			if (!id.equals("minecraft:short_grass") && !id.equals("minecraft:tall_grass")) {
          				return;
          			}
          			if (serverLevel.getRandom().nextFloat() >= OpDropsConfig.grassDropChance) {
          				return;
          			}

          			for (ItemStack loot : OpLoot.roll(serverLevel)) {
          				Containers.dropItemStack(serverLevel, pos.getX() + 0.5, pos.getY() + 0.5, pos.getZ() + 0.5, loot);
          			}
          		});

          		LOGGER.info("Op Drops загружен: яйца и трава теперь опасно щедрые.");
          	}
          }
          EGGDROPS_EOF
          mkdir -p src/main/java/com/example/eggdrops
          cat > src/main/java/com/example/eggdrops/OpDropsConfig.java <<'EGGDROPS_EOF'
          package com.example.eggdrops;

          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Properties;
          import net.fabricmc.loader.api.FabricLoader;

          /**
           * Настройки мода. Хранятся в config/eggdrops.properties и правятся через Mod Menu.
           * Значения — доли от 0.0 до 1.0 (1.0 = 100%).
           */
          public final class OpDropsConfig {

          	private OpDropsConfig() {}

          	/** Шанс, что брошенное яйцо при попадании уронит лут. */
          	public static float eggDropChance = 1.0f;

          	/** Шанс, что сломанная трава уронит лут. */
          	public static float grassDropChance = 1.0f;

          	/** Шанс «высокого» уровня при дропе (2 разных предмета вместо одного). */
          	public static float highTierChance = 0.25f;

          	private static Path file() {
          		return FabricLoader.getInstance().getConfigDir().resolve("eggdrops.properties");
          	}

          	private static float clamp(float v) {
          		return Math.max(0.0f, Math.min(1.0f, v));
          	}

          	private static float read(Properties props, String key, float fallback) {
          		String raw = props.getProperty(key);
          		if (raw == null) {
          			return fallback;
          		}
          		try {
          			return clamp(Float.parseFloat(raw.trim()));
          		} catch (NumberFormatException ex) {
          			return fallback;
          		}
          	}

          	public static void load() {
          		Path path = file();
          		if (Files.exists(path)) {
          			Properties props = new Properties();
          			try (Reader reader = Files.newBufferedReader(path, StandardCharsets.UTF_8)) {
          				props.load(reader);
          				eggDropChance = read(props, "eggDropChance", eggDropChance);
          				grassDropChance = read(props, "grassDropChance", grassDropChance);
          				highTierChance = read(props, "highTierChance", highTierChance);
          			} catch (IOException ex) {
          				EggDropsMod.LOGGER.warn("Не удалось прочитать конфиг, использую значения по умолчанию", ex);
          			}
          		}
          		save(); // создаём файл, если его ещё нет
          	}

          	public static void save() {
          		Properties props = new Properties();
          		props.setProperty("eggDropChance", Float.toString(clamp(eggDropChance)));
          		props.setProperty("grassDropChance", Float.toString(clamp(grassDropChance)));
          		props.setProperty("highTierChance", Float.toString(clamp(highTierChance)));

          		try (Writer writer = Files.newBufferedWriter(file(), StandardCharsets.UTF_8)) {
          			props.store(writer, "Op Drops: шансы от 0.0 до 1.0 (1.0 = 100%)");
          		} catch (IOException ex) {
          			EggDropsMod.LOGGER.warn("Не удалось сохранить конфиг", ex);
          		}
          	}
          }
          EGGDROPS_EOF
          mkdir -p src/main/java/com/example/eggdrops/client
          cat > src/main/java/com/example/eggdrops/client/OpDropsModMenu.java <<'EGGDROPS_EOF'
          package com.example.eggdrops.client;

          import com.terraformersmc.modmenu.api.ConfigScreenFactory;
          import com.terraformersmc.modmenu.api.ModMenuApi;

          /** Подключает экран настроек к кнопке «Настроить» в Mod Menu. Загружается только на клиенте. */
          public class OpDropsModMenu implements ModMenuApi {

          	@Override
          	public ConfigScreenFactory<?> getModConfigScreenFactory() {
          		return parent -> new OpDropsConfigScreen(parent);
          	}
          }
          EGGDROPS_EOF
          mkdir -p src/main/java/com/example/eggdrops/client
          cat > src/main/java/com/example/eggdrops/client/OpDropsConfigScreen.java <<'EGGDROPS_EOF'
          package com.example.eggdrops.client;

          import com.example.eggdrops.OpDropsConfig;
          import java.util.function.DoubleConsumer;
          import java.util.function.DoubleSupplier;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;

          /**
           * Экран настроек: каждая кнопка по клику переключает шанс по кругу
           * 0% → 10% → 25% → 50% → 75% → 100% → 0%...
           * Намеренно без собственной отрисовки, чтобы не зависеть от внутренностей GUI.
           */
          public class OpDropsConfigScreen extends Screen {

          	private static final double[] STEPS = {0.0, 0.10, 0.25, 0.50, 0.75, 1.0};

          	private final Screen parent;

          	public OpDropsConfigScreen(Screen parent) {
          		super(Component.literal("Op Drops — настройки"));
          		this.parent = parent;
          	}

          	@Override
          	protected void init() {
          		int w = 260;
          		int x = this.width / 2 - w / 2;
          		int y = this.height / 2 - 70;

          		// Заголовок — неактивная кнопка (самый простой «лейбл» без своей отрисовки).
          		Button heading = Button.builder(this.title, b -> {}).bounds(x, y, w, 20).build();
          		heading.active = false;
          		this.addRenderableWidget(heading);

          		this.addRenderableWidget(chanceButton(x, y + 32, w, "Шанс дропа из яйца",
          				() -> OpDropsConfig.eggDropChance, v -> OpDropsConfig.eggDropChance = (float) v));

          		this.addRenderableWidget(chanceButton(x, y + 58, w, "Шанс дропа из травы",
          				() -> OpDropsConfig.grassDropChance, v -> OpDropsConfig.grassDropChance = (float) v));

          		this.addRenderableWidget(chanceButton(x, y + 84, w, "Шанс высокого уровня (2 предмета)",
          				() -> OpDropsConfig.highTierChance, v -> OpDropsConfig.highTierChance = (float) v));

          		this.addRenderableWidget(Button.builder(Component.literal("Готово"), b -> this.onClose())
          				.bounds(x, y + 120, w, 20).build());
          	}

          	private static Button chanceButton(int x, int y, int w, String label,
          			DoubleSupplier getter, DoubleConsumer setter) {
          		return Button.builder(text(label, getter.getAsDouble()), b -> {
          			setter.accept(nextStep(getter.getAsDouble()));
          			b.setMessage(text(label, getter.getAsDouble()));
          		}).bounds(x, y, w, 20).build();
          	}

          	private static Component text(String label, double value) {
          		return Component.literal(label + ": " + Math.round(value * 100) + "%");
          	}

          	private static double nextStep(double current) {
          		for (double step : STEPS) {
          			if (step > current + 0.001) {
          				return step;
          			}
          		}
          		return STEPS[0];
          	}

          	@Override
          	public void onClose() {
          		OpDropsConfig.save();
          		this.minecraft.gui.setScreen(this.parent);
          	}
          }
          EGGDROPS_EOF
          mkdir -p src/main/java/com/example/eggdrops
          cat > src/main/java/com/example/eggdrops/OpLoot.java <<'EGGDROPS_EOF'
          package com.example.eggdrops;

          import java.util.List;
          import java.util.function.Function;
          import net.minecraft.core.Holder;
          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.ResourceKey;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.item.enchantment.Enchantment;
          import net.minecraft.world.item.enchantment.Enchantments;

          /**
           * Два пула лута:
           *  - LOW  — обычный уровень, роняет 1 предмет (зачарования на максимуме обычной игры);
           *  - HIGH — высокий уровень, роняет 2 разных предмета (зачарования выше ванильного максимума).
           * Броня, мечи, топоры и кирки — только незеритовые.
           */
          public final class OpLoot {

          	private OpLoot() {}

          	private record Ench(ResourceKey<Enchantment> key, int level) {}

          	private static Ench e(ResourceKey<Enchantment> key, int level) {
          		return new Ench(key, level);
          	}

          	private static Function<ServerLevel, ItemStack> stack(Item item, int count) {
          		return level -> new ItemStack(item, count);
          	}

          	private static Function<ServerLevel, ItemStack> gear(Item item, Ench... enchants) {
          		return level -> {
          			ItemStack stack = new ItemStack(item);
          			var registry = level.registryAccess().lookupOrThrow(Registries.ENCHANTMENT);
          			for (Ench ench : enchants) {
          				Holder<Enchantment> holder = registry.getOrThrow(ench.key());
          				stack.enchant(holder, ench.level());
          			}
          			return stack;
          		};
          	}

          	// ------------------------------------------------------------------- LOW
          	private static final List<Function<ServerLevel, ItemStack>> LOW = List.of(
          			// Блоки руд
          			stack(Items.GOLD_BLOCK, 32),
          			stack(Items.IRON_BLOCK, 32),
          			stack(Items.COAL_BLOCK, 64),
          			stack(Items.EMERALD_BLOCK, 32),
          			stack(Items.DIAMOND, 64),

          			// Еда
          			stack(Items.GOLDEN_APPLE, 32),
          			stack(Items.GOLDEN_CARROT, 64),
          			stack(Items.COOKED_BEEF, 64),

          			// Полезное
          			stack(Items.EXPERIENCE_BOTTLE, 64),
          			stack(Items.ENDER_PEARL, 16),
          			stack(Items.FIREWORK_ROCKET, 64),
          			stack(Items.WIND_CHARGE, 64),
          			stack(Items.TNT, 64),

          			// Незеритовое снаряжение — максимум обычных зачарований
          			gear(Items.NETHERITE_HELMET,
          					e(Enchantments.PROTECTION, 4), e(Enchantments.RESPIRATION, 3),
          					e(Enchantments.AQUA_AFFINITY, 1), e(Enchantments.UNBREAKING, 3),
          					e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_LEGGINGS,
          					e(Enchantments.PROTECTION, 4), e(Enchantments.UNBREAKING, 3),
          					e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_SWORD,
          					e(Enchantments.SHARPNESS, 5), e(Enchantments.SWEEPING_EDGE, 3),
          					e(Enchantments.LOOTING, 3), e(Enchantments.FIRE_ASPECT, 2),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_PICKAXE,
          					e(Enchantments.EFFICIENCY, 5), e(Enchantments.FORTUNE, 3),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),

          			// Остальное оружие
          			gear(Items.BOW,
          					e(Enchantments.POWER, 5), e(Enchantments.INFINITY, 1),
          					e(Enchantments.FLAME, 1), e(Enchantments.UNBREAKING, 3)),
          			gear(Items.CROSSBOW,
          					e(Enchantments.QUICK_CHARGE, 3), e(Enchantments.PIERCING, 4),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.TRIDENT,
          					e(Enchantments.IMPALING, 5), e(Enchantments.LOYALTY, 3),
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1)),
          			gear(Items.SHIELD,
          					e(Enchantments.UNBREAKING, 3), e(Enchantments.MENDING, 1))
          	);

          	// ------------------------------------------------------------------ HIGH
          	private static final List<Function<ServerLevel, ItemStack>> HIGH = List.of(
          			// Ресурсы и еда
          			stack(Items.ENCHANTED_GOLDEN_APPLE, 64),
          			stack(Items.NETHERITE_INGOT, 32),
          			stack(Items.NETHERITE_BLOCK, 8),
          			stack(Items.DIAMOND_BLOCK, 64),
          			stack(Items.GOLD_BLOCK, 64),
          			stack(Items.IRON_BLOCK, 64),
          			stack(Items.COAL_BLOCK, 64),

          			// Редкости
          			stack(Items.TOTEM_OF_UNDYING, 1),
          			stack(Items.NETHER_STAR, 8),
          			stack(Items.BEACON, 4),
          			stack(Items.DRAGON_EGG, 1),
          			stack(Items.END_CRYSTAL, 64),
          			gear(Items.ELYTRA,
          					e(Enchantments.UNBREAKING, 10), e(Enchantments.MENDING, 1)),

          			// Незеритовое снаряжение — зачарования выше ванильного максимума
          			gear(Items.NETHERITE_HELMET,
          					e(Enchantments.PROTECTION, 10), e(Enchantments.RESPIRATION, 5),
          					e(Enchantments.AQUA_AFFINITY, 1), e(Enchantments.UNBREAKING, 10),
          					e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_CHESTPLATE,
          					e(Enchantments.PROTECTION, 10), e(Enchantments.THORNS, 5),
          					e(Enchantments.UNBREAKING, 10), e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_LEGGINGS,
          					e(Enchantments.PROTECTION, 10), e(Enchantments.SWIFT_SNEAK, 5),
          					e(Enchantments.UNBREAKING, 10), e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_BOOTS,
          					e(Enchantments.PROTECTION, 10), e(Enchantments.FEATHER_FALLING, 10),
          					e(Enchantments.DEPTH_STRIDER, 5), e(Enchantments.UNBREAKING, 10),
          					e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_SWORD,
          					e(Enchantments.SHARPNESS, 10), e(Enchantments.SWEEPING_EDGE, 5),
          					e(Enchantments.LOOTING, 5), e(Enchantments.FIRE_ASPECT, 4),
          					e(Enchantments.UNBREAKING, 10), e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_AXE,
          					e(Enchantments.SHARPNESS, 10), e(Enchantments.EFFICIENCY, 10),
          					e(Enchantments.UNBREAKING, 10), e(Enchantments.MENDING, 1)),
          			gear(Items.NETHERITE_PICKAXE,
          					e(Enchantments.EFFICIENCY, 10), e(Enchantments.FORTUNE, 5),
          					e(Enchantments.UNBREAKING, 10), e(Enchantments.MENDING, 1)),
          			gear(Items.MACE,
          					e(Enchantments.DENSITY, 10), e(Enchantments.BREACH, 6),
          					e(Enchantments.WIND_BURST, 5), e(Enchantments.UNBREAKING, 10),
          					e(Enchantments.MENDING, 1))
          	);

          	/** Возвращает предметы для одного дропа: 1 (обычный уровень) или 2 разных (высокий). */
          	public static List<ItemStack> roll(ServerLevel level) {
          		var random = level.getRandom();

          		if (random.nextFloat() < OpDropsConfig.highTierChance) {
          			int first = random.nextInt(HIGH.size());
          			int second = random.nextInt(HIGH.size() - 1);
          			if (second >= first) {
          				second++; // гарантирует, что второй предмет отличается от первого
          			}
          			return List.of(HIGH.get(first).apply(level), HIGH.get(second).apply(level));
          		}

          		return List.of(LOW.get(random.nextInt(LOW.size())).apply(level));
          	}
          }
          EGGDROPS_EOF
          mkdir -p src/main/java/com/example/eggdrops/mixin
          cat > src/main/java/com/example/eggdrops/mixin/ProjectileMixin.java <<'EGGDROPS_EOF'
          package com.example.eggdrops.mixin;

          import com.example.eggdrops.OpDropsConfig;
          import com.example.eggdrops.OpLoot;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.Containers;
          import net.minecraft.world.entity.projectile.Projectile;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.phys.HitResult;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /**
           * Вешаемся на общий класс Projectile и проверяем тип сущности — так мы не зависим
           * от точного пакета ThrownEgg, который Mojang переносил между версиями.
           */
          @Mixin(Projectile.class)
          public abstract class ProjectileMixin {

          	@Inject(method = "onHit", at = @At("HEAD"))
          	private void eggdrops$dropOpLoot(HitResult hitResult, CallbackInfo ci) {
          		Projectile projectile = (Projectile) (Object) this;

          		// Сверяем по id сущности, а не по константе EntityType.EGG (её название менялось).
          		String id = BuiltInRegistries.ENTITY_TYPE.getKey(projectile.getType()).toString();
          		if (!id.equals("minecraft:egg")) {
          			return;
          		}
          		if (!(projectile.level() instanceof ServerLevel level)) {
          			return;
          		}
          		if (level.getRandom().nextFloat() >= OpDropsConfig.eggDropChance) {
          			return;
          		}

          		for (ItemStack loot : OpLoot.roll(level)) {
          			Containers.dropItemStack(level, projectile.getX(), projectile.getY(), projectile.getZ(), loot);
          		}
          	}
          }
          EGGDROPS_EOF

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0

      - name: Build mod
        run: gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: eggdrops-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
